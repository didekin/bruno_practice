[project]
name = "userstory-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2,<3",
    "pydantic>=2.14.4",
]

[project.scripts]
userstory-tests = "userstory_tools:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.106",
]

[tool.uv.build-backend]
module-name = "userstory_tools"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["I"]  # Check import ordering

[tool.pytest.ini_options]
testpaths = ["tests"]


